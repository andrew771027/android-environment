name: Hosted Android Emulator CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  
#  pull_request:
#    paths:
#      - "scripts/**"
#      - "config/**"
#      - "tests/**"
#      - ".github/workflows/hosted-emulator.yml"
#      - "Makefile"

permissions:
  contents: read


concurrency:
  group: hosted-emulator-${{ github.ref }}
  cancel-in-progress: true


jobs:

  hosted-emulator:

    name: API 36 Headless Smoke

    # Pin the image while ubuntu-latest is migrating to 26.04.
    runs-on: ubuntu-24.04

    timeout-minutes: 20

    env:

      ANDROID_API_LEVEL: "36"
      ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
    
    steps:

      # --------------------------------------------------
      # Source
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4    
      
      # --------------------------------------------------
      # Python test runtime
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=9.1.1,<10.0.0'
        
      # --------------------------------------------------
      # Diagnostics
      # --------------------------------------------------    

      - name: Configure Android SDK paths
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_HOME or ANDROID_SDK_ROOT must point to the Android SDK"
            exit 1
          fi

          if [[ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "::error::sdkmanager is missing from $sdk_root/cmdline-tools/latest/bin"
            exit 1
          fi

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"

      - name: Show hosted runner environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          uname -a
          java -version
          
          command -v sdkmanager
          command -v adb || true
          command -v emulator || true

          ls -l /dev/kvm || true
        
      # --------------------------------------------------
      # KVM
      # --------------------------------------------------

      - name: Enable KVM permission
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        
          sudo udevadm control --reload-rules

          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle

          # Apply access immediately to the existing device on this hosted runner.
          sudo chmod a+rw /dev/kvm

      - name: Verify KVM permission
        run: |
          ls -l /dev/kvm

          test -r /dev/kvm
          test -w /dev/kvm
      
      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
      
      - name: Install required Android SDK packages
        run: |
          make install-sdk
        
      - name: Check Emulator acceleration
        run: |
          make kvm-check
      
      # --------------------------------------------------
      # AVD
      # --------------------------------------------------

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          make create-avd
      
      - name: Validate provisioned environment
        run: |
          make validate

          emulator -list-avds

      # --------------------------------------------------
      # Real Android runtime
      # --------------------------------------------------

      - name: Run real Headless Emulator Smoke Test
        run: |
          make hosted-emulator-ci
    
      # --------------------------------------------------
      # Diagnostics
      # --------------------------------------------------
      - name: Collect Android diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          
          {
            echo "=== runner ==="
            uname -a

            echo
            echo "=== KVM === "
            ls -l /dev/kvm || true

            echo
            emulator --accel-check || true

            echo
            echo "=== AVD ==="
            emulator -list-avds || true

            echo
            echo "=== ADB ==="
            adb devices -l || true

          } > artifacts/hosted-ci-diagnostics.txt

      # --------------------------------------------------
      # Artifacts
      # --------------------------------------------------
      - name: Upload Hosted Emulator artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-emulator-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
