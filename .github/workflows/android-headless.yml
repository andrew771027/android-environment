name: Android Environment CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'pytest>=9.1.1,<10.0.0'
      - run: make unit-test

  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl libgl1 libpulse0
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          echo "$HOME/Android/Sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/Android/Sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/Android/Sdk/emulator" >> "$GITHUB_PATH"
      - name: Install Android command-line tools
        run: make linux-tools
      - name: Accept Android SDK licenses
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 141 ]]; then exit "$status"; fi
        shell: bash
      - name: Install SDK and create AVD
        run: |
          make install-sdk
          make create-avd
      - name: Check KVM
        run: make kvm-check
      - name: Run real emulator smoke test
        run: make headless-smoke
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: artifacts/
          if-no-files-found: ignore
